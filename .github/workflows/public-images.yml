name: Check published photographs
on:
  schedule:
    - cron: '23 14 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-images:
    if: github.repository == 'kristencline-arch/color-study'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            public/sources.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/check-public-images.mjs --limit=24
